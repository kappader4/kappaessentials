name: kappaessentials
version: '1.2-SNAPSHOT'
main: net.kappasmp.kappaessentials.KappaEssentials
api-version: '1.21'
folia-supported: true
softdepend: ["PlaceholderAPI"]
commands:
  bal:
    description: Shows your current balance.
    usage: /bal
  pay:
    description: Sends money to another player.
    usage: /pay <player> <amount>
  sell:
    description: Opens the Sell GUI.
    usage: /sell
  reload:
    description: Reloads the plugin configuration and data files.
    usage: /reload
  afk:
    description: Toggles your AFK (away from keyboard) status.
    usage: /afk
  tokens:
    description: Shows your current token balance.
    usage: /tokens
  tokentop:
    description: Displays the top players by token balance.
    usage: /tokentop
  baltop:
    description: Displays the top players by money balance.
    usage: /baltop
  bounty:
    description: Places a bounty on another player's head.
    usage: /bounty <player> <amount>
  tpa:
    description: Sends a teleport request to another player.
    usage: /tpa <player>
  tpahere:
    description: Sends a request for another player to teleport to you.
    usage: /tpahere <player>
  tpaccept:
    description: Accepts a pending teleport request.
    usage: /tpaccept
  tpdeny:
    description: Denies a pending teleport request.
    usage: /tpdeny
  sethome:
    description: Sets your home at your current location.
    usage: /sethome [name]
  home:
    description: Teleports you to one of your saved homes.
    usage: /home [name]
  delhome:
    description: Deletes one of your saved homes.
    usage: /delhome [name]
  shop:
    description: Opens the server shop GUI to buy and sell items.
    usage: /shop
  ah:
    description: Opens the auction house or sells an item.
    usage: /ah [sell <price>] | /ah my